  h += `<tr><td>${typ} ${name.replace(/ \(.*\)/, "")}</td>`;
  for (const a of D.aktien) {
    const k = a.konten.find(x => x.typ === typ);
    h += `<td class="num"><span class="${cls(k.rendite)}">${k.investiert ? "●" : "○"} ${sign(k.rendite)} %</span><span class="chf">${fmt(k.wert, 0)} CHF</span></td>`;

  h += "</tr>";
}

// Grafiken
const charts = [];
function zeichne() {
  charts.splice(0).forEach(c => c.destroy());
  const ink = css("--muted"), grid = css("--grid");
  D.aktien.forEach(a => charts.push(new Chart(document.getElementById(`p_${a.id}`), {
    type: "line",
    data: { labels: a.verlauf_zeit, datasets: [{ label: a.symbol, data: a.verlauf_pct, borderColor: css("--accent"), backgroundColor: css("--accent") }] },
    options: {
      responsive: true, maintainAspectRatio: false, animation: false,
      interaction: { mode: "index", intersect: false },

      elements: { point: { radius: 0, hoverRadius: 4 }, line: { borderWidth: 2, tension: 0 } }
    }
  })));
}

  zeichne();
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", zeichne);
  new MutationObserver(zeichne).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
}
