const TYPEN = D.aktien[0].konten.map(k => [k.typ, k.name]);

// Übersicht Konto × Aktie
let h = `<thead><tr><th>Konto</th>${D.aktien.map(a => `<th>${a.name}</th>`).join("")}</tr></thead><tbody>`;
for (const [typ, name] of TYPEN) {
  h += `<tr><td>${typ} ${name.replace(/ \(.*\)/, "")}</td>`;
  for (const a of D.aktien) {
    const k = a.konten.find(x => x.typ === typ);
    h += `<td class="num"><span class="${cls(k.rendite)}">${k.investiert ? "●" : "○"} ${sign(k.rendite)} %</span><span class="chf">${fmt(k.wert, 0)} CHF</span></td>`;

  h += "</tr>";
}
document.getElementById("uebersicht").innerHTML = h + "</tbody>";

  s.className = "panel";
  s.setAttribute("aria-label", a.name);
  s.innerHTML = `<div class="kopf"><h2>${a.name}</h2><span class="kurs num">${fmt(a.kurs)} USD</span></div>

});

// Grafiken
const charts = [];
function zeichne() {
  charts.splice(0).forEach(c => c.destroy());
  const ink = css("--muted"), grid = css("--grid");
  D.aktien.forEach(a => charts.push(new Chart(document.getElementById(`p_${a.id}`), {
    type: "line",
    data: { labels: a.verlauf_zeit, datasets: [{ label: a.symbol, data: a.verlauf_pct, borderColor: css("--accent"), backgroundColor: css("--accent") }] },
    options: {
      responsive: true, maintainAspectRatio: false, animation: false,
      interaction: { mode: "index", intersect: false },
      plugins: { legend: { display: false }, tooltip: { callbacks: { label: c => ` ${sign(c.parsed.y)} % seit Start` } } },

        x: { ticks: { color: ink, maxTicksLimit: 3, maxRotation: 0, font: { family: css("--mono"), size: 10 } }, grid: { display: false } },

      },
      elements: { point: { radius: 0, hoverRadius: 4 }, line: { borderWidth: 2, tension: 0 } }
    }
  })));
}
if (window.Chart) {
  zeichne();
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", zeichne);
  new MutationObserver(zeichne).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
}
